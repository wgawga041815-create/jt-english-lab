<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外贸英语 · 俊通达练习站</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" data-tab="home">
    <span class="brand-mark">JT</span>
    <span class="brand-text">
      <strong>外贸英语</strong>
      <em>俊通达 · 充电器与数据线</em>
    </span>
  </a>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active">今日</button>
    <button data-tab="words">单词</button>
    <button data-tab="grammar">语法</button>
    <button data-tab="listening">听力</button>
    <button data-tab="speaking">口语</button>
  </nav>
  <div class="progress-pill" id="topProgress">0 / 1000</div>
</header>

<main id="app">
  <section id="view-home" class="view active"></section>
  <section id="view-words" class="view"></section>
  <section id="view-grammar" class="view"></section>
  <section id="view-listening" class="view"></section>
  <section id="view-speaking" class="view"></section>
</main>

<footer class="foot">
  <span>俊通达电子 · 外贸英语练习</span>
  <span>每天 15 分钟，词、听力、口语各练一点。</span>
</footer>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="data-more.js"></script>
<script src="data-1000.js"></script>
<script src="data-plus.js"></script>
<script src="app.js"></script>
</body>
</html>
